[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
succra = "2DkVabKRQ3R8ZXtJkptAVvnWDm6DuhakhPqpvoVKsJeT"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "mocha -t 1000000 --require ts-node/register --compiler-options {\"module\":\"commonjs\",\"moduleResolution\":\"node\",\"verbatimModuleSyntax\":false,\"types\":[\"node\",\"mocha\"]} programs/succra/tests/*.ts"
