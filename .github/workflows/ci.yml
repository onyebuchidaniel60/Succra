# SUCCRA CI — web, Supabase (real local stack), Solana program.
#
# Jobs: web (required), supabase (required), solana-cargo (required),
# solana-e2e (required: pinned Docker toolchain; see job comment).
#
# Triggers: push to main, pull requests, and pushes to any `phase-*`
# iteration branch (Phase 4+ verification; `phase-3-ci` matches the glob
# and needs no exact entry anymore).
# No secrets: the Supabase job uses local dev keys only.

name: ci

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

jobs:
  web:
    name: web (lint, typecheck, test, build, format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format

  supabase:
    name: supabase (real stack + live RLS/auth)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: npx -y supabase start
      - name: Reset database (applies migrations from scratch)
        run: npx -y supabase db reset
      - name: Lint database
        run: npx -y supabase db lint
      - name: Export local Supabase env
        run: |
          set +e
          npx -y supabase status -o env > /tmp/status-env.txt 2>&1
          echo "env exit: $?"
          npx -y supabase status -o json > /tmp/status-json.txt 2>&1
          echo "json exit: $?"
          echo 'env keys seen:'
          cut -d= -f1 /tmp/status-env.txt 2> /dev/null || echo '(no env output)'
          python3 - <<'PYEOF'
          import json
          import re
          import sys

          found = {}
          try:
              for line in open('/tmp/status-env.txt'):
                  line = line.strip()
                  if line.startswith('export '):
                      line = line[len('export ') :]
                  match = re.match(r'([A-Za-z_][A-Za-z0-9_]*)=(.*)$', line)
                  if match:
                      found[match.group(1)] = match.group(2).strip().strip('"').strip("'")
          except OSError:
              pass
          try:
              payload = json.load(open('/tmp/status-json.txt'))
              if isinstance(payload, dict):
                  for key, value in payload.items():
                      if isinstance(value, str) and value and key not in found:
                          found[str(key)] = value
          except (OSError, ValueError):
              pass

          def pick(*fragments):
              for name, value in found.items():
                  lowered = name.lower()
                  if value and all(part in lowered for part in fragments):
                      return value
              return None

          url = pick('supabase', 'url') or pick('api', 'url') or pick('url')
          anon = pick('anon')
          service = pick('service')
          print('candidate key names:', sorted(found))
          missing = []
          if not url or not url.startswith('http'):
              missing.append('SUPABASE_URL')
          if not anon or not anon.startswith('eyJ'):
              missing.append('SUPABASE_ANON_KEY')
          if not service or not service.startswith('eyJ'):
              missing.append('SUPABASE_SERVICE_ROLE_KEY')
          if missing:
              print(f'MISSING OR MALFORMED KEYS: {missing}', file=sys.stderr)
              sys.exit(1)
          with open('/tmp/succra-supabase.env', 'w') as out:
              out.write(f'SUPABASE_URL={url}\n')
              out.write(f'SUPABASE_ANON_KEY={anon}\n')
              out.write(f'SUPABASE_SERVICE_ROLE_KEY={service}\n')
          PYEOF
          while IFS='=' read -r key value; do
            if [ -n "$key" ]; then echo "$key=$value" >> "$GITHUB_ENV"; fi
          done < /tmp/succra-supabase.env
          echo 'exported SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY'
      - name: Build web app
        run: pnpm --filter @succra/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      - name: Boot web app with short nonce TTL
        run: |
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
          NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 \
          SUCCRA_NONCE_TTL_SECONDS=10 \
          PORT=3100 \
          pnpm --filter @succra/web start > /tmp/succra-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then
              echo "web app ready after ${attempt} checks"
              break
            fi
            sleep 5
          done
          curl -sf http://127.0.0.1:3100/ > /dev/null
      # Phase 4.1 (option a): gateway/contract suites run in this job. The live
      # Alpha test (tests/integration/phase4-alpha-live.test.ts) is NOT run
      # here — it requires SUCCRA_GATEWAY_FEE_PAYER_SECRET_KEY + a validator
      # URL + IDL/keypair and skips honestly without them (same pattern as
      # the Phase 2 expiry tests). No new job, no continue-on-error.
      - name: Run live Supabase integration suite
        run: pnpm vitest run tests/integration/supabase-rls-live.test.ts tests/integration/supabase-rls-phase4.test.ts "apps/web/tests/gateway-*.test.ts" apps/web/tests/mission-state.test.ts apps/web/tests/txkit-interop.test.ts "packages/sdk/tests/*.test.ts" "packages/shared/tests/*.test.ts"
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: http://127.0.0.1:3100
      - name: Show web app log on failure
        if: failure()
        run: tail -n 200 /tmp/succra-web.log || true
      - name: Stop web app
        if: always()
        run: pkill -f "next-server" || true
      - name: Stop Supabase
        if: always()
        run: npx -y supabase stop --no-backup

  solana-cargo:
    name: solana-cargo (program build, unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
            target/
            programs/succra/target/
          key: solana-cargo-${{ runner.os }}-${{ hashFiles('programs/succra/Cargo.lock') }}
          restore-keys: |
            solana-cargo-${{ runner.os }}-
      - name: cargo build
        run: cargo build --manifest-path programs/succra/Cargo.toml
      - name: cargo test
        run: cargo test --manifest-path programs/succra/Cargo.toml

  # solana-e2e is REQUIRED: it runs the Phase 2 expiry E2E tests on a
  # normal-speed Linux validator plus program-level regression coverage
  # (needed before Phase 5 touches the program).
  # Toolchain comes from a pinned Docker image built on the fly from
  # .github/docker/solana-e2e.Dockerfile. Build-on-the-fly was chosen over
  # a published GHCR image to avoid registry publish plumbing
  # (chicken-and-egg on first run) for a solo project; it is
  # self-contained in one PR. Trade-off: every run pays a full image
  # rebuild (slower than a cached registry image — a later upgrade path
  # if this gets painful).
  # Do not delete this job. Do not re-add continue-on-error without
  # explicit human authorization.
  solana-e2e:
    name: solana-e2e (program build, validator suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        # --progress=plain: expanded RUN output for diagnosis (default
        # progress collapses the failing layer).
        run: docker build --progress=plain -f .github/docker/solana-e2e.Dockerfile -t succra-solana-e2e .
      - name: Run e2e suite in container
        id: e2e
        continue-on-error: true
        # pnpm exec prefix: mocha must resolve inside the container PATH.
        # solana (not anchor) deploy: proven path from Phase 2 local runs.
        # No stop-validator step: `docker run --rm` tears the validator
        # down with the container; its log persists via the /work mount.
        run: |
          docker run --rm -v "$PWD:/work" -w /work succra-solana-e2e bash -lc '
            set -euo pipefail
            pnpm install --frozen-lockfile
            solana --version
            cargo build-sbf --version
            anchor --version | grep -q "0.32.1"
            cargo build --manifest-path programs/succra/Cargo.toml
            cargo test --manifest-path programs/succra/Cargo.toml
            # Program keypair is not committed (target/ is gitignored);
            # generate fresh and sync declare_id + Anchor.toml so the CI
            # workspace is self-consistent. Not committed.
            mkdir -p target/deploy
            if [ ! -f target/deploy/succra-keypair.json ]; then
              solana-keygen new --no-bip39-passphrase --silent -o target/deploy/succra-keypair.json
            fi
            anchor keys sync
            anchor build --no-idl
            # anchor build writes the .so to the per-program target dir on this
            # toolchain; the deploy command expects it at the workspace root.
            mkdir -p target/deploy
            if [ ! -f target/deploy/succra.so ]; then
              if [ -f programs/succra/target/deploy/succra.so ]; then
                cp programs/succra/target/deploy/succra.so target/deploy/succra.so
              else
                echo "ERROR: no .so at programs/succra/target/deploy/succra.so either" >&2
                find . -name '*.so' -not -path './node_modules/*' >&2 || true
                exit 1
              fi
            fi
            anchor idl build -o target/idl/succra.json -t target/types/succra.ts --skip-lint
            solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json || true
            solana-test-validator --ledger /tmp/succra-test-ledger --reset --quiet > /work/validator-e2e.log 2>&1 &
            for attempt in $(seq 1 60); do
              if solana cluster-version --url http://127.0.0.1:8899 > /dev/null 2>&1; then
                echo "validator ready after ${attempt} checks"
                break
              fi
              sleep 2
            done
            solana cluster-version --url http://127.0.0.1:8899
            solana program deploy --url http://127.0.0.1:8899 target/deploy/succra.so --program-id target/deploy/succra-keypair.json
            ANCHOR_PROVIDER_URL=http://127.0.0.1:8899 ANCHOR_WALLET=~/.config/solana/id.json pnpm exec mocha -t 1000000 --require ts-node/register --compiler-options {"module":"commonjs","moduleResolution":"node","verbatimModuleSyntax":false,"types":["node","mocha"]} "programs/succra/tests/*.ts"
          '
      - name: Diagnostics summary
        if: always()
        run: |
          {
            echo "## solana-e2e diagnostics"
            echo ""
            echo "**e2e step outcome:** ${{ steps.e2e.outcome }}"
            echo ""
            echo "### target/deploy contents (host)"
            ls -la target/deploy/ 2>&1 || echo "target/deploy does not exist"
            echo ""
            echo "### programs/succra/target/deploy contents (host)"
            ls -la programs/succra/target/deploy/ 2>&1 || echo "does not exist"
            echo ""
            echo "### All .so files in repo"
            find . -name '*.so' -not -path './node_modules/*' -not -path './target/*' 2>/dev/null || true
            echo ""
            echo "### validator-e2e.log (last 40 lines)"
            tail -40 validator-e2e.log 2>&1 || echo "no validator log"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if e2e step failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - name: Show validator log on failure
        if: failure()
        run: tail -n 200 /work/validator-e2e.log || true
