# SUCCRA CI — web, Supabase (real local stack), Solana program.
#
# Triggers: push to main, pull requests, and pushes to the `phase-3-ci`
# iteration branch (Phase 3.1 verification; remove that branch entry when
# the branch is merged and deleted — it is harmless afterwards).
# No secrets: the Supabase job uses local dev keys only.

name: ci

on:
  push:
    branches: [main, phase-3-ci]
  pull_request:

jobs:
  web:
    name: web (lint, typecheck, test, build, format)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format

  supabase:
    name: supabase (real stack + live RLS/auth)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase
        run: npx -y supabase start
      - name: Reset database (applies migrations from scratch)
        run: npx -y supabase db reset
      - name: Lint database
        run: npx -y supabase db lint
      - name: Export local Supabase env
        run: |
          set +e
          npx -y supabase status -o env > /tmp/status-env.txt 2>&1
          echo "env exit: $?"
          npx -y supabase status -o json > /tmp/status-json.txt 2>&1
          echo "json exit: $?"
          echo 'env keys seen:'
          cut -d= -f1 /tmp/status-env.txt 2> /dev/null || echo '(no env output)'
          python3 - <<'PYEOF'
          import json
          import re
          import sys

          found = {}
          try:
              for line in open('/tmp/status-env.txt'):
                  line = line.strip()
                  if line.startswith('export '):
                      line = line[len('export ') :]
                  match = re.match(r'([A-Za-z_][A-Za-z0-9_]*)=(.*)$', line)
                  if match:
                      found[match.group(1)] = match.group(2).strip().strip('"').strip("'")
          except OSError:
              pass
          try:
              payload = json.load(open('/tmp/status-json.txt'))
              if isinstance(payload, dict):
                  for key, value in payload.items():
                      if isinstance(value, str) and value and key not in found:
                          found[str(key)] = value
          except (OSError, ValueError):
              pass

          def pick(*fragments):
              for name, value in found.items():
                  lowered = name.lower()
                  if value and all(part in lowered for part in fragments):
                      return value
              return None

          url = pick('supabase', 'url') or pick('api', 'url') or pick('url')
          anon = pick('anon')
          service = pick('service')
          print('candidate key names:', sorted(found))
          missing = []
          if not url or not url.startswith('http'):
              missing.append('SUPABASE_URL')
          if not anon or not anon.startswith('eyJ'):
              missing.append('SUPABASE_ANON_KEY')
          if not service or not service.startswith('eyJ'):
              missing.append('SUPABASE_SERVICE_ROLE_KEY')
          if missing:
              print(f'MISSING OR MALFORMED KEYS: {missing}', file=sys.stderr)
              sys.exit(1)
          with open('/tmp/succra-supabase.env', 'w') as out:
              out.write(f'SUPABASE_URL={url}\n')
              out.write(f'SUPABASE_ANON_KEY={anon}\n')
              out.write(f'SUPABASE_SERVICE_ROLE_KEY={service}\n')
          PYEOF
          while IFS='=' read -r key value; do
            if [ -n "$key" ]; then echo "$key=$value" >> "$GITHUB_ENV"; fi
          done < /tmp/succra-supabase.env
          echo 'exported SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY'
      - name: Build web app
        run: pnpm --filter @succra/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
      - name: Boot web app with short nonce TTL
        run: |
          NEXT_PUBLIC_SUPABASE_URL="$SUPABASE_URL" \
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$SUPABASE_ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
          NEXT_PUBLIC_APP_URL=http://127.0.0.1:3100 \
          SUCCRA_NONCE_TTL_SECONDS=10 \
          PORT=3100 \
          pnpm --filter @succra/web start > /tmp/succra-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3100/ > /dev/null; then
              echo "web app ready after ${attempt} checks"
              break
            fi
            sleep 5
          done
          curl -sf http://127.0.0.1:3100/ > /dev/null
      - name: Run live Supabase integration suite
        run: pnpm vitest run tests/integration/supabase-rls-live.test.ts
        env:
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          APP_URL: http://127.0.0.1:3100
      - name: Show web app log on failure
        if: failure()
        run: tail -n 200 /tmp/succra-web.log || true
      - name: Stop web app
        if: always()
        run: pkill -f "next-server" || true
      - name: Stop Supabase
        if: always()
        run: npx -y supabase stop --no-backup

  solana:
    name: solana (program build, unit, validator suite)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Cache toolchains and build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
            ~/.avm
            ~/.cache/solana
            target/
            programs/succra/target/
          key: solana-2.3.0-anchor-0.32.1-tools-1.48-${{ runner.os }}-${{ hashFiles('programs/succra/Cargo.lock') }}
          restore-keys: |
            solana-2.3.0-anchor-0.32.1-tools-1.48-${{ runner.os }}-
      - name: Install Solana 2.3.0 (Agave)
        run: |
          # NOTE: release.solana.com is dead for 2.x installers (curl fails
          # and `sh -c ""` would silently succeed). Agave lives at
          # release.anza.xyz; download-then-verify so a bad fetch fails loud.
          curl -sSfL https://release.anza.xyz/v2.3.0/install -o /tmp/solana-install.sh
          test -s /tmp/solana-install.sh
          sh /tmp/solana-install.sh
          # Agave installs versioned releases under install/active_release.
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor 0.32.1 via avm
        run: |
          # Anchor lives at otter-sec/anchor now (coral-xyz redirects there);
          # use the official prebuilt-avm installer (no cargo compile).
          curl -sSfL https://raw.githubusercontent.com/otter-sec/anchor/master/avm/install | sh
          echo "$HOME/.avm/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.avm/bin:$HOME/.cargo/bin:$PATH"
          avm install 0.32.1
          avm use 0.32.1
          anchor --version
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
          rustup toolchain list
          rustup show active-toolchain
      - name: Verify Solana install
        run: |
          solana --version
          cargo build-sbf --version
      - name: Install platform-tools v1.48
        # Agave 2.3.0's cargo-build-sbf has no --install-only flag; running
        # it with --force-tools-install installs the pinned tools (anchor
        # reuses both the tools and this build incrementally afterwards).
        run: cargo build-sbf --tools-version v1.48 --force-tools-install --manifest-path programs/succra/Cargo.toml
      - name: cargo build
        run: cargo build --manifest-path programs/succra/Cargo.toml
      - name: cargo test
        run: cargo test --manifest-path programs/succra/Cargo.toml
      - name: Assert pinned Anchor version is active
        # avm use must persist across steps; a nightly/default shim would
        # fail the Anchor.toml anchor_version match inside anchor build.
        run: anchor --version | grep -q '0.32.1'
      - name: anchor build
        run: anchor build --no-idl
      - name: anchor idl build
        run: anchor idl build -o target/idl/succra.json -t target/types/succra.ts --skip-lint
      - name: Start local validator
        run: |
          solana-keygen new --no-bip39-passphrase --silent --outfile ~/.config/solana/id.json || true
          solana-test-validator --ledger /tmp/succra-test-ledger --reset --quiet > /tmp/validator.log 2>&1 &
          for attempt in $(seq 1 60); do
            if solana cluster-version --url http://127.0.0.1:8899 > /dev/null 2>&1; then
              echo "validator ready after ${attempt} checks"
              break
            fi
            sleep 2
          done
          solana cluster-version --url http://127.0.0.1:8899
      - name: Deploy program
        run: solana program deploy --url http://127.0.0.1:8899 target/deploy/succra.so --program-id target/deploy/succra-keypair.json
      - name: Run mocha integration suite
        run: >-
          mocha -t 1000000 --require ts-node/register
          --compiler-options {"module":"commonjs","moduleResolution":"node","verbatimModuleSyntax":false,"types":["node","mocha"]}
          "programs/succra/tests/*.ts"
        env:
          ANCHOR_PROVIDER_URL: http://127.0.0.1:8899
          ANCHOR_WALLET: ~/.config/solana/id.json
      - name: Show validator log on failure
        if: failure()
        run: tail -n 200 /tmp/validator.log || true
      - name: Stop validator
        if: always()
        run: pkill -f solana-test-validator || true
